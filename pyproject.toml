[project]
name = "whim"
version = "0.1.0"
description = "Headless harness for one persistent, self-directed character"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "aiohttp>=3.9",
    "jsonschema>=4.18",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.18"]

[project.scripts]
whim = "whim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Live tests call the real API; run them explicitly with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the real DeepSeek API (needs a key from `whim auth set`)"]
